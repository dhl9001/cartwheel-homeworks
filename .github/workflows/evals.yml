# The CI workflow for Homework 6.
#
# On every push, the workflow runs unit and integration tests without model
# calls. On pull requests and each nightly run, the workflow checks that an
# evaluation request was not copied into the agent prompt or a judge example,
# then runs every classified Harbor task five times in Docker.
#
# Homework 8 adds the Module 4 adversarial tests to the offline-checks job, so
# a security regression fails the same workflow as a quality regression.

name: evals

on:
  push:
  pull_request:
  schedule:
    - cron: "17 9 * * *" # nightly, catches provider-side drift between PRs

jobs:
  offline-checks:
    name: unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Unit and integration tests, with no model keys
        run: uv run pytest tests/eval -k "unit or integration" -q
      - name: Homework structural checks
        run: uv run pytest tests/test_hw_holes.py -q
      - name: CLI and database lifecycle checks, with no model keys
        run: uv run pytest tests/test_cli.py tests/test_db.py -q

  complete-evaluations:
    name: Harbor evaluations
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CARTWHEEL_MODEL: ${{ vars.CARTWHEEL_MODEL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PYTHONPATH: ${{ github.workspace }}
      # Harbor 0.23 stops draining compose output when several image builds
      # run together, so build and run one trial at a time.
      BUILDKIT_PROGRESS: quiet
      COMPOSE_BAKE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Require the model variable and agent key
        run: |
          if [ -z "$CARTWHEEL_MODEL" ]; then
            echo "Set the CARTWHEEL_MODEL repository variable."
            exit 1
          fi
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "Set the OPENAI_API_KEY repository secret."
            exit 1
          fi
          echo "Agent model: $CARTWHEEL_MODEL"
      - run: uv sync
      - name: Evaluation case and prompt leakage check
        run: uv run python scripts/check_leakage.py
      - name: Install Harbor
        run: |
          uv tool install 'harbor==0.23.0'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Generate classified Harbor tasks
        run: uv run python scripts/export_harbor_tasks.py
      - name: Run Harbor evaluations
        run: |
          harbor run \
            -p .harbor/tasks \
            -a harbor_adapter.agent:CartwheelAgent \
            -m "$CARTWHEEL_MODEL" \
            -e docker \
            --n-attempts 5 \
            --n-concurrent 1 \
            --job-name hw6-evals \
            --jobs-dir .harbor/jobs \
            --yes
      - name: Summarize Harbor job
        if: always()
        run: uv run python scripts/summarize_harbor_job.py .harbor/jobs/hw6-evals --expected-attempts 5
      - name: Upload Harbor job
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hw6-evals
          path: .harbor/jobs/hw6-evals
          if-no-files-found: warn
