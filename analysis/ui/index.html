<!DOCTYPE html>
<!--
  Cartwheel pilot-trace review UI.

  Adapted from the course reference reviewer for the observed Langfuse shape:
  per-turn traces, nested OpenAI "parts" envelopes, and duplicate generation
  spans. This page shows one scenario at a time: the reconstructed
  conversation (user / tool call+result / assistant), the expected outcome
  from the scenario file, and a free-text annotation field.

  Visual encoding: hue = message role; container = tool call with its result;
  monospace = arguments and structured results; expected outcome lives in a
  separate panel so it does not reuse a role color.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cartwheel trace review</title>
<style>
  :root {
    --role-user: #2563eb;
    --role-assistant: #059669;
    --role-tool-call: #b45309;
    --role-tool-result: #7c3aed;
    --role-retrieval: #0891b2;
    --bg: #f4f5f7;
    --panel: #ffffff;
    --ink: #171717;
    --muted: #6b7280;
    --line: #e5e7eb;
    --expected: #fff7ed;
    --expected-edge: #c2410c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; min-width: 1100px; }
  body {
    margin: 0;
    color: var(--ink);
    background: var(--bg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  code, pre, .mono { font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; }

  header {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 16px; background: var(--panel);
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 40;
  }
  header h1 { font-size: 15px; margin: 0; }
  header h1 span { color: var(--muted); font-weight: 400; }
  .spacer { flex: 1; }
  .counts, .save-state { color: var(--muted); font-size: 13px; }
  .save-state.ok { color: var(--role-assistant); }
  .save-state.err { color: #dc2626; }
  header button, .nav button {
    border: 1px solid var(--line); background: var(--bg);
    padding: 6px 12px; border-radius: 6px; cursor: pointer; font: inherit;
  }
  .nav { display: flex; gap: 4px; align-items: center; }
  .nav .pos { min-width: 72px; text-align: center; font-size: 13px; color: var(--muted); }

  .app {
    display: grid;
    grid-template-columns: 260px minmax(0, 1fr) 320px;
    grid-template-areas: "rail main side";
    height: calc(100% - 53px);
  }
  .rail {
    grid-area: rail;
    padding: 12px;
    background: var(--panel);
    border-right: 1px solid var(--line);
    overflow: auto;
  }
  .main { grid-area: main; overflow: auto; padding: 20px 24px 80px; }
  .side {
    grid-area: side; background: var(--panel);
    border-left: 1px solid var(--line); padding: 16px; overflow: auto;
  }
  .rail input {
    width: 100%; padding: 7px 9px; border: 1px solid var(--line);
    border-radius: 6px; font: inherit; margin-bottom: 8px;
  }
  .scenario {
    width: 100%; text-align: left; border: 0; background: transparent;
    padding: 8px 8px; border-radius: 6px; cursor: pointer; font: inherit;
    display: grid; gap: 2px;
  }
  .scenario:hover { background: var(--bg); }
  .scenario.active { background: #111; color: #fff; }
  .scenario.active .meta { color: #d1d5db; }
  .scenario .id { font-weight: 650; font-size: 13px; }
  .scenario .meta { color: var(--muted); font-size: 12px; }
  .dot {
    width: 7px; height: 7px; border-radius: 50%; display: inline-block;
    background: var(--line); margin-right: 6px;
  }
  .dot.filled { background: var(--role-assistant); }

  .trace-header { margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .tid { font-weight: 700; margin-right: 8px; }
  .chip {
    display: inline-block; font-size: 12px; color: var(--muted);
    background: #eef0f3; padding: 2px 8px; border-radius: 999px; margin: 0 4px 4px 0;
  }
  .flag { background: #fef3c7; color: #92400e; }
  .langfuse { font-size: 12px; color: var(--role-user); }

  .step {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    margin-bottom: 18px; overflow: hidden;
  }
  .step.retrieval { border-color: #a5f3fc; }
  .msg { padding: 10px 14px; border-left: 4px solid var(--line); }
  .msg + .msg { border-top: 1px solid var(--line); }
  .msg .role {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .04em; margin-bottom: 5px;
  }
  .msg[data-role="user"] { border-left-color: var(--role-user); }
  .msg[data-role="user"] .role { color: var(--role-user); }
  .msg[data-role="assistant"] { border-left-color: var(--role-assistant); }
  .msg[data-role="assistant"] .role { color: var(--role-assistant); }
  .msg[data-role="tool_call"] { border-left-color: var(--role-tool-call); }
  .msg[data-role="tool_call"] .role { color: var(--role-tool-call); }
  .msg[data-role="tool_result"] { border-left-color: var(--role-tool-result); }
  .msg[data-role="tool_result"] .role { color: var(--role-tool-result); }
  .msg[data-role="tool_result"].retrieval { border-left-color: var(--role-retrieval); }
  .msg[data-role="tool_result"].retrieval .role { color: var(--role-retrieval); }
  .text { white-space: pre-wrap; word-break: break-word; }
  .fn { font-weight: 700; }
  details.args { margin-top: 6px; }
  details.args summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  pre.json {
    background: #f3f4f6; border-radius: 6px; padding: 8px 10px; margin: 6px 0 0;
    font-size: 12.5px; overflow-x: auto; white-space: pre;
  }
  .turn-break {
    color: var(--muted); font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .06em;
    margin: 28px 0 12px; padding-top: 8px;
    border-top: 2px dashed var(--line);
  }
  .empty { color: var(--muted); padding: 24px 0; }

  .panel-title {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .05em; color: var(--muted); margin: 0 0 8px;
  }
  .expected {
    background: var(--expected); border-left: 4px solid var(--expected-edge);
    border-radius: 8px; padding: 12px; margin-bottom: 18px;
  }
  .expected h2 { margin: 0 0 6px; font-size: 15px; }
  .expected .reason, .expected .source { font-size: 13px; color: #7c2d12; margin-top: 8px; }
  textarea {
    width: 100%; min-height: 180px; resize: vertical;
    border: 1px solid var(--line); border-radius: 8px;
    padding: 10px; font: inherit; line-height: 1.45;
  }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  #toast {
    position: fixed; right: 16px; bottom: 16px; z-index: 80;
    background: #111; color: #fff; padding: 10px 14px; border-radius: 8px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>Cartwheel <span>pilot review</span></h1>
  <div class="nav">
    <button id="prev" type="button">&larr;</button>
    <span class="pos" id="pos">0 / 0</span>
    <button id="next" type="button">&rarr;</button>
  </div>
  <div class="spacer"></div>
  <div class="counts" id="counts"></div>
  <div class="save-state" id="save-state"></div>
  <button id="refresh" type="button">Reload from Langfuse</button>
</header>
<div class="app">
  <aside class="rail">
    <input id="filter" placeholder="Filter by id, role, intent…" />
    <div id="list"></div>
  </aside>
  <main class="main">
    <div class="trace-header" id="trace-header"></div>
    <div id="trace-body"></div>
  </main>
  <aside class="side">
    <div class="panel-title">Expected outcome</div>
    <div class="expected" id="expected"></div>
    <div class="panel-title">Your note</div>
    <textarea id="note" aria-label="Annotation" placeholder="What happened, in your own words. First failure only."></textarea>
    <div class="hint">Saved to analysis/state/annotations.json as you type. Arrow keys move between traces.</div>
  </aside>
</div>
<div id="toast"></div>
<script>
const state = {
  samples: [],
  annotations: [],
  cur: 0,
  filter: "",
  saveTimer: null,
};

const api = {
  async get(path) { const r = await fetch(path); return r.json(); },
  async post(path, body) {
    const r = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: body === undefined ? "{}" : JSON.stringify(body),
    });
    return r.json();
  },
};

function asAnnotationList(value) {
  if (Array.isArray(value)) return value;
  if (value && Array.isArray(value.annotations)) return value.annotations;
  return [];
}

function escape(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function scenarioId(sample) {
  return (sample && sample.meta && sample.meta.scenario_id) || (sample && sample.trace_id) || "";
}

function noteFor(sample) {
  if (!sample) return "";
  const sid = scenarioId(sample);
  const matches = state.annotations.filter((ann) =>
    (ann.scenario_id && ann.scenario_id === sid) ||
    ann.trace_id === sample.trace_id ||
    (sample.trace_ids || []).includes(ann.trace_id)
  );
  const whole = matches.filter((ann) => !ann.quote);
  const picked = whole.at(-1) || matches.at(-1);
  return (picked && picked.note) || "";
}

function hasNote(sample) {
  return Boolean(noteFor(sample).trim());
}

function visibleSamples() {
  const q = state.filter.trim().toLowerCase();
  if (!q) return state.samples;
  return state.samples.filter((sample) => {
    const meta = sample.meta || {};
    const expected = sample.expected || {};
    const tuple = expected.tuple || {};
    const blob = [
      scenarioId(sample), meta.role, expected.scenario_group,
      tuple.intent, tuple.difficulty, sample.trace_id,
    ].join(" ").toLowerCase();
    return blob.includes(q);
  });
}

function curSample() {
  const vis = visibleSamples();
  if (!vis.length) return null;
  state.cur = Math.max(0, Math.min(state.cur, vis.length - 1));
  return vis[state.cur];
}

function toast(message) {
  const el = document.getElementById("toast");
  el.textContent = message;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2400);
}

function setSaveState(text, kind) {
  const el = document.getElementById("save-state");
  el.textContent = text;
  el.className = "save-state" + (kind ? " " + kind : "");
}

function backupAnnotations() {
  try { localStorage.setItem("cartwheel_review_notes", JSON.stringify(state.annotations)); }
  catch (err) {}
}

async function saveAnnotations() {
  backupAnnotations();
  setSaveState("Saving…");
  try {
    const result = await api.post("/api/annotations", state.annotations);
    if (result && result.error) setSaveState("Save failed", "err");
    else setSaveState("Saved", "ok");
  } catch (err) {
    setSaveState("Save failed", "err");
  }
}

function scheduleSave() {
  clearTimeout(state.saveTimer);
  state.saveTimer = setTimeout(saveAnnotations, 400);
}

function upsertNote(text) {
  const sample = curSample();
  if (!sample) return;
  const sid = scenarioId(sample);
  const ts = new Date().toISOString();
  const keep = state.annotations.filter((ann) => {
    const same =
      (ann.scenario_id && ann.scenario_id === sid) ||
      ann.trace_id === sample.trace_id;
    return !(same && !ann.quote);
  });
  if (text.trim()) {
    keep.push({
      id: "note-" + sid,
      trace_id: sample.trace_id,
      scenario_id: sid,
      note: text,
      ts,
      author: "human",
    });
  }
  state.annotations = keep;
  renderList();
  scheduleSave();
}

function pretty(value) {
  if (value === undefined || value === null) return "";
  if (typeof value === "string") {
    try { return JSON.stringify(JSON.parse(value), null, 2); }
    catch (err) { return value; }
  }
  return JSON.stringify(value, null, 2);
}

function summarize(name, value) {
  if (value && typeof value === "object") {
    if (Array.isArray(value.orders)) return name + " — " + value.orders.length + " orders";
    if (Array.isArray(value.results)) return name + " — " + value.results.length + " snippets";
    if (Array.isArray(value.products)) return name + " — " + value.products.length + " products";
    if (value.order && value.order.order_id) {
      return name + " — order " + value.order.order_id + " " + (value.order.status || "");
    }
    if (value.policy_id) return name + " — " + value.policy_id;
    if (value.ok === false) return name + " — error";
  }
  const text = pretty(value);
  return text.length > 80 ? name + " — " + text.slice(0, 80) + "…" : (name || "value");
}

function renderPayload(name, value) {
  const text = pretty(value);
  if (!text) return "";
  if (text.length < 280) return `<pre class="json">${escape(text)}</pre>`;
  return `<details class="args"><summary>${escape(summarize(name, value))}</summary><pre class="json">${escape(text)}</pre></details>`;
}

function formatCall(name, args) {
  if (!args || typeof args !== "object" || Array.isArray(args)) {
    return escape(name) + "()";
  }
  const keys = Object.keys(args);
  if (!keys.length) return escape(name) + "()";
  const inner = keys.map((key) => {
    const val = args[key];
    const shown = typeof val === "string" ? JSON.stringify(val) : JSON.stringify(val);
    return key + "=" + shown;
  }).join(", ");
  return escape(name) + "(" + escape(inner) + ")";
}

function renderMsg(message) {
  const role = message.role || "assistant";
  const retrieval = message.retrieval ? " retrieval" : "";
  if (role === "tool_call") {
    return `<div class="msg" data-role="tool_call">
      <div class="role">tool call</div>
      <div class="fn">${formatCall(message.name || "tool", message.arguments)}</div>
    </div>`;
  }
  if (role === "tool_result") {
    return `<div class="msg${retrieval}" data-role="tool_result">
      <div class="role">${message.retrieval ? "retrieved" : "tool result"}</div>
      ${renderPayload(message.name || "result", message.content)}
    </div>`;
  }
  const label = role.replace(/_/g, " ");
  return `<div class="msg" data-role="${escape(role)}">
    <div class="role">${escape(label)}</div>
    <div class="text">${escape(message.text || "")}</div>
  </div>`;
}

function renderExpected(sample, targetId) {
  const el = document.getElementById(targetId);
  const expected = sample && sample.expected;
  if (!expected) {
    el.innerHTML = '<div class="empty">No matching scenario record.</div>';
    return;
  }
  const title = expected.outcome || expected.criterion || "(no named outcome)";
  const source = expected.source || {};
  const bits = [];
  bits.push(`<h2>${escape(title)}</h2>`);
  bits.push(`<div class="chip">${escape(expected.evaluation || "unknown")}</div>`);
  if (expected.scenario_group) bits.push(`<div class="chip">${escape(expected.scenario_group)}</div>`);
  if (expected.reason) bits.push(`<div class="reason">${escape(expected.reason)}</div>`);
  if (source.type || source.reference) {
    bits.push(`<div class="source">${escape([source.type, source.reference].filter(Boolean).join(" · "))}</div>`);
  }
  el.innerHTML = bits.join("");
}

function renderHeader() {
  const sample = curSample();
  const el = document.getElementById("trace-header");
  const vis = visibleSamples();
  document.getElementById("pos").textContent = vis.length ? `${state.cur + 1} / ${vis.length}` : "0 / 0";
  const annotated = state.samples.filter(hasNote).length;
  document.getElementById("counts").textContent =
    `${annotated} / ${state.samples.length} annotated`;
  if (!sample) {
    el.innerHTML = '<span class="empty">No traces loaded. Use Reload from Langfuse.</span>';
    return;
  }
  const meta = sample.meta || {};
  const expected = sample.expected || {};
  const tuple = expected.tuple || {};
  const chips = [];
  if (meta.role) chips.push(`<span class="chip">${escape(meta.role)}</span>`);
  if (expected.scenario_group) chips.push(`<span class="chip">${escape(expected.scenario_group)}</span>`);
  if (tuple.intent) chips.push(`<span class="chip">${escape(tuple.intent)}</span>`);
  if (tuple.difficulty) chips.push(`<span class="chip">${escape(tuple.difficulty)}</span>`);
  if (tuple.order_id) chips.push(`<span class="chip">order ${escape(tuple.order_id)}</span>`);
  if (meta.prompt_version) chips.push(`<span class="chip">prompt ${escape(meta.prompt_version)}</span>`);
  (sample.flags || []).forEach((flag) => chips.push(`<span class="chip flag">${escape(flag)}</span>`));
  const links = (sample.trace_ids || [sample.trace_id]).map((id) =>
    `<a class="langfuse" href="${escape(sample.permalink.replace(/\/traces\/[^/]+$/, "/traces/" + id))}" target="_blank" rel="noreferrer">${escape(id.slice(0, 8))}…</a>`
  ).join(" ");
  el.innerHTML = `<div><span class="tid">${escape(scenarioId(sample))}</span>${chips.join("")}</div>
    <div class="langfuse">Langfuse ${links}</div>`;
}

function renderTrace() {
  const sample = curSample();
  const body = document.getElementById("trace-body");
  if (!sample || !Array.isArray(sample.trace) || !sample.trace.length) {
    body.innerHTML = '<div class="empty">No conversation on this trace.</div>';
    return;
  }
  const html = [];
  let i = 0;
  const msgs = sample.trace;
  while (i < msgs.length) {
    const message = msgs[i];
    if (message.role === "turn_break") {
      html.push(`<div class="turn-break">${escape(message.label || "Follow-up")}</div>`);
      i += 1;
      continue;
    }
    if (message.role === "tool_call") {
      const parts = [renderMsg(message)];
      const retrieval = Boolean(message.retrieval);
      if (i + 1 < msgs.length && msgs[i + 1].role === "tool_result") {
        parts.push(renderMsg(msgs[i + 1]));
        i += 1;
      }
      html.push(`<div class="step${retrieval ? " retrieval" : ""}">${parts.join("")}</div>`);
    } else {
      html.push(`<div class="step">${renderMsg(message)}</div>`);
    }
    i += 1;
  }
  body.innerHTML = html.join("");
}

function renderList() {
  const el = document.getElementById("list");
  const vis = visibleSamples();
  el.innerHTML = vis.map((sample, index) => {
    const meta = sample.meta || {};
    const expected = sample.expected || {};
    const tuple = expected.tuple || {};
    const tools = (sample.features || {}).tool_call_count || 0;
    const active = index === state.cur ? " active" : "";
    return `<button class="scenario${active}" data-index="${index}" type="button">
      <span class="id"><span class="dot${hasNote(sample) ? " filled" : ""}"></span>${escape(scenarioId(sample))}</span>
      <span class="meta">${escape([meta.role, tuple.intent, tools + " tools"].filter(Boolean).join(" · "))}</span>
    </button>`;
  }).join("") || '<div class="empty">No matching traces.</div>';
}

function renderAll() {
  renderList();
  renderHeader();
  const sample = curSample();
  renderExpected(sample, "expected");
  renderTrace();
  const note = document.getElementById("note");
  if (document.activeElement !== note) note.value = noteFor(sample);
}

async function loadAll() {
  const [samples, annotations] = await Promise.all([
    api.get("/api/samples"),
    api.get("/api/annotations"),
  ]);
  state.samples = Array.isArray(samples) ? samples : [];
  state.annotations = asAnnotationList(annotations);
  renderAll();
}

function move(delta) {
  const vis = visibleSamples();
  if (!vis.length) return;
  state.cur = (state.cur + delta + vis.length) % vis.length;
  renderAll();
}

document.getElementById("prev").addEventListener("click", () => move(-1));
document.getElementById("next").addEventListener("click", () => move(1));
document.getElementById("list").addEventListener("click", (event) => {
  const button = event.target.closest(".scenario");
  if (!button) return;
  state.cur = Number(button.dataset.index);
  renderAll();
});
document.getElementById("filter").addEventListener("input", (event) => {
  state.filter = event.target.value;
  state.cur = 0;
  renderAll();
});
document.getElementById("note").addEventListener("input", (event) => {
  upsertNote(event.target.value);
});
document.getElementById("refresh").addEventListener("click", async () => {
  setSaveState("Loading traces…");
  const result = await api.post("/api/refresh", {});
  if (result && result.error) {
    setSaveState(result.error, "err");
    toast(result.error);
    return;
  }
  toast("Loaded " + (result.count || 0) + " scenarios");
  await loadAll();
  setSaveState("Saved", "ok");
});
document.addEventListener("keydown", (event) => {
  if (event.target.tagName === "TEXTAREA" || event.target.tagName === "INPUT") return;
  if (event.key === "ArrowLeft" || event.key === "k") move(-1);
  if (event.key === "ArrowRight" || event.key === "j") move(1);
});

loadAll();
setInterval(async () => {
  const samples = await api.get("/api/samples");
  if (Array.isArray(samples) && samples.length !== state.samples.length) {
    state.samples = samples;
    renderAll();
    toast("Sample set updated");
  }
}, 8000);
</script>
</body>
</html>
